; SA:COOP dedicated server settings. The server reads this file at its start.
; docs/FORK.md in the repository describes every key.
[server]
name = SA:COOP server
; UDP port. The firewall and the hosting provider's rules must let it in.
port = 7788
; The address to listen on. Empty: every address of the machine.
bind =
; Empty: no password.
password =
; Players in the game: 2 to 4.
max_players = 4
; The nickname that always gets the host role on joining. Empty: the first player in the game is the host.
host =
motd = Welcome! /help lists the commands.
; 1: players can hurt each other.
friendly_fire = 0
; 0: no /tp and /tphere for partners.
partner_teleport = 1
; 1: a partner's death fails the host's story mission.
shared_life = 0
; 0: no cheat codes for partners.
partner_cheats = 1
; 1: the server finds its public address and writes an invite code to server-data/invite.txt.
internet = 1

; 1: the server keeps the one shared world, whoever hosts. A world upload replaces it only from a game that plays it
; (or after an admin's /acceptworld). Every replaced world is kept as server-data/world/world.b.1 to world.b.10.
dedicated = 1
; Nicknames with the admin commands (/host, /kick, /acceptworld, /restoreworld, /newgame), separated by commas.
admins =
; A password for /admin <password>, which gives a player the admin commands for the session. Empty: none.
admin_password =
; How often the server asks the host's game for a world snapshot, in minutes. 0: never.
snapshot_minutes = 5
