name: Bug or suggestion
description: Report of a bug or a game crash, or an idea
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Bug
        - Game crash
        - Suggestion
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what was expected. For a suggestion, what the mod should have.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What was done before the bug. For a bug that repeats, the steps.
      placeholder: |
        1. The host started a server from a save.
        2. A friend joined by code.
        3. The host stepped into a mission marker, and the friend's screen froze.
  - type: dropdown
    id: who
    attributes:
      label: Affected player
      options:
        - Host
        - Partner
        - Both
  - type: input
    id: version
    attributes:
      label: Mod version
      description: Shown at the top right of the F9 window.
      placeholder: 0.1.0
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Clean 1.0 US
        - Build with mods
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        `coop\coop.log` from the game folder of the player with the bug. After a crash, `coop\crash.log` as well;
        when joining fails, the host's `coop\server-data\server.log`.
