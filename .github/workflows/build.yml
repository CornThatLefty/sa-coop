# Builds SA:COOP on every push and pull request and keeps the archive as an artifact.
# A tag like v0.2.0 also publishes the archive as a GitHub release, with the text of .github/release-notes.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the compiler
        uses: actions/cache@v4
        with:
          path: toolchain/llvm-mingw
          key: llvm-mingw-20261006-ucrt-x86_64

      - name: Get the compiler
        shell: pwsh
        run: ./tools/get-toolchain.ps1

      - name: Check the layers (Feature-Sliced Design)
        run: python tools/fsd_check.py

      - name: Check that every text of the game has its English one
        run: python tools/i18n_check.py
        env:
          PYTHONIOENCODING: utf-8  # it prints the Russian texts it finds

      - name: Build the archive
        run: python tools/build.py dist

      - name: Test the server
        run: |
          python tools/build.py server testclient
          python tools/test_server.py

      - uses: actions/upload-artifact@v4
        with:
          name: SA-COOP
          path: |
            dist/SA-COOP.zip
            dist/coop.pdb

      # the skin packs and the voices: 650 MB the mod runs without, kept for a release only
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: SA-COOP-extras
          path: dist/SA-COOP-extras.zip
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SA:COOP ${{ github.ref_name }}
          files: |
            dist/SA-COOP.zip
            dist/SA-COOP-extras.zip
            dist/coop.pdb
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-fork.') }}  # the fork's test builds

  # The dedicated server for Linux (docs/FORK.md, "Linux server"): built, run against the same tests as the Windows
  # one, and kept as an artifact. 22.04 for its glibc: the program runs on that and anything newer.
  linux:
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the server and the test client
        run: python tools/build.py server testclient

      - name: Test the server
        run: python tools/test_server.py

      - name: Build the archive
        run: python tools/build.py dist

      - name: What the server needs from the machine
        run: |
          ldd dist/coop-server-linux-x86_64/coop-server
          objdump -T dist/coop-server-linux-x86_64/coop-server | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coop-server-linux-x86_64
          path: dist/coop-server-linux-x86_64.tar.gz

  # a tag's release gets the Linux server too, once the Windows job has published it
  linux-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coop-server-linux-x86_64

      - name: Add the Linux server to the release
        run: gh release upload "${{ github.ref_name }}" coop-server-linux-x86_64.tar.gz --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
